<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>ДЕПНУТЬ ХАТУ</title>
</head>
<body>
    <h1 id="bandit-header">ЖМИ, НЕ РОБЕЙ, ЖИТУХА БУДЕТ ВЕСЕЛЕЙ!</h1>
    <div id="bandit-full">
        <div id="slot-screen">
            <div id="slot-1" class="slot">
                <div id="slot-img-top" class="slot-img"><span class="inSlotText" id="slot1-top-text">7</span></div>
                <div id="slot-img-center" class="slot-img"><span class="inSlotText" id="slot1-mid-text">7</span></div>
                <div id="slot-img-bot" class="slot-img"><span class="inSlotText" id="slot1-bot-text">7</span></div>
            </div>
            <div id="slot-2" class="slot">
                <div id="slot-img-top" class="slot-img"><span class="inSlotText" id="slot2-top-text">7</span></div>
                <div id="slot-img-center" class="slot-img"><span class="inSlotText" id="slot2-mid-text">7</span></div>
                <div id="slot-img-bot" class="slot-img"><span class="inSlotText" id="slot2-bot-text">7</span></div>
            </div>
            <div id="slot-3" class="slot">
                <div id="slot-img-top" class="slot-img"><span class="inSlotText" id="slot3-top-text">7</span></div>
                <div id="slot-img-center" class="slot-img"><span class="inSlotText" id="slot3-mid-text">7</span></div>
                <div id="slot-img-bot" class="slot-img"><span class="inSlotText" id="slot3-bot-text">7</span></div>
            </div>
        </div>
        <button id="bet" onclick="start()"><span>СДЕЛАТЬ СТАВКУ</span></button>
    </div>


    <script src="./script.js"></script>
</body>
</html>
